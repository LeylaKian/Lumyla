name: lumyla

services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec npm run dev
    ports:
      - "3000:5173"
    environment:
      # Passed through from the platform; never hardcoded.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - API_PROXY_TARGET=http://api:8080
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: "Lumyla Website"
      base44.kind: "web"
      base44.port: "3000"

  api:
    image: node:22-alpine
    working_dir: /app/api
    volumes:
      - ./api:/app/api
      - api_data:/data
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec npm run start
    environment:
      - PORT=8080
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: on-failure
    labels:
      base44.project: "Lumyla Website"
      base44.kind: "api"
      base44.port: "8080"

volumes:
  api_data:
